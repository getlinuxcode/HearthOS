# Ajouté par Hearth à chaque lancement (--appendconfig) : RetroArch sert seulement de moteur.
video_fullscreen = "true"
pause_nonactive = "false"
config_save_on_exit = "false"
# Start + Select : quitter le jeu et revenir à l'interface
input_quit_gamepad_combo = "4"
quit_press_twice = "false"
# Pas de menu RetroArch à l'écran (le combo L3+R3 reste disponible pour les sauvegardes d'état)
input_menu_toggle_gamepad_combo = "2"
menu_show_load_content_animation = "false"
notification_show_autoconfig = "false"
savestate_auto_save = "true"
savestate_auto_load = "true"
system_directory = "~/.local/share/hearth/share/bios"
